services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ejz-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./APIsistema-administracion-documental-ej-zuniga-main/Database:/docker-entrypoint-initdb:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ejz-network

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ejz-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      DB_NAME: ${DB_NAME:-BDProyecto}
    volumes:
      - ./APIsistema-administracion-documental-ej-zuniga-main/Database:/scripts:ro
      - ./docker/db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    networks:
      - ejz-network
    restart: "no"

  api:
    build:
      context: ./APIsistema-administracion-documental-ej-zuniga-main
      dockerfile: Dockerfile
    container_name: ejz-api
    depends_on:
      db-init:
        condition: service_completed_successfully
      ocr-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CadenaSQL: "Server=db;Database=${DB_NAME:-BDProyecto};User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=False"
      Jwt__key: ${JWT_KEY:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32_CHARS_MIN}
      Email__Host: ${EMAIL_HOST:-smtp.gmail.com}
      Email__Port: ${EMAIL_PORT:-587}
      Email__UserName: ${EMAIL_USERNAME:-}
      Email__PassWord: ${EMAIL_PASSWORD:-}
      Supabase__Url: ${SUPABASE_URL:-}
      Supabase__ServiceKey: ${SUPABASE_SERVICE_KEY:-}
      Supabase__Bucket: ${SUPABASE_BUCKET:-documentos}
      Interfaz__Url: ${FRONTEND_URL:-http://localhost:5290}
      ApiSettings__BEPYTHON: http://ocr-api:8000
      InternalJwt__Issuer: ${INTERNAL_JWT_ISSUER:-estudio-juridico-api}
      InternalJwt__Audience: ${INTERNAL_JWT_AUDIENCE:-ocr-api}
      InternalJwt__Subject: ${INTERNAL_JWT_SUBJECT:-estudio-juridico-api}
      InternalJwt__PrivateKeyPath: /run/secrets/internal-jwt-private.pem
      InternalJwt__LifetimeSeconds: ${INTERNAL_JWT_LIFETIME_SECONDS:-60}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5290}
    ports:
      - "${API_PORT:-5159}:8080"
    volumes:
      - api_docs:/app/DocumentosSistema
      - ./secrets/internal-jwt-private-dev.pem:/run/secrets/internal-jwt-private.pem:ro
    networks:
      - ejz-network

  ocr-api:
    build:
      context: ./Proyecto-Python-E-J-Zuniga-main
      dockerfile: Dockerfile
    container_name: ejz-ocr-api
    environment:
      CORS_ORIGINS: ${OCR_CORS_ORIGINS:-http://localhost:5159,http://localhost:5290}
      TESSERACT_CMD: /usr/bin/tesseract
      INTERNAL_JWT_PUBLIC_KEY_PATH: /run/secrets/internal-jwt-public.pem
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-estudio-juridico-api}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE:-ocr-api}
      INTERNAL_JWT_SUBJECT: ${INTERNAL_JWT_SUBJECT:-estudio-juridico-api}
      FILES_DIR: /app/OCR_API/files
      MODELS_DIR: /app/OCR_API/models
    ports:
      - "${OCR_PORT:-8000}:8000"
    volumes:
      - ocr_files:/app/OCR_API/files
      - ocr_models:/app/OCR_API/models
      - ./secrets/internal-jwt-public.pem:/run/secrets/internal-jwt-public.pem:ro
    networks:
      - ejz-network

  frontend:
    build:
      context: ./UI-Sistema-de-Administracion-documental-E-J-Zuniga-master
      dockerfile: Dockerfile
    container_name: ejz-frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CadenaSQL: "Server=db;Database=${DB_NAME:-BDProyecto};User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=False"
      ApiSettings__BENET: http://api:8080
      Firebase__ApiKey: ${FIREBASE_API_KEY:-}
      Firebase__AuthDomain: ${FIREBASE_AUTH_DOMAIN:-}
      DataProtection__KeysPath: /app/keys
    ports:
      - "${FRONTEND_PORT:-5290}:8080"
    volumes:
      - frontend_keys:/app/keys
    networks:
      - ejz-network

volumes:
  mssql_data:
  api_docs:
  ocr_files:
  ocr_models:
  frontend_keys:

networks:
  ejz-network:
    driver: bridge
